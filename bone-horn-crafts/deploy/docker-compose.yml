# Bone Horn Crafts — local or single-host production stack.
#
#   docker compose up -d
#   docker compose exec wordpress bash /opt/bhc/bin/setup-demo.sh /var/www/html
#
# The theme and plugin are bind-mounted from this repository, so editing a PHP
# file here changes the running site with no rebuild and no sync step.
#
# NOT verified by the author: this file was written against the documented
# behaviour of these images but could not be executed in the authoring
# environment, which has no Docker daemon. Treat it as a starting point.

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-bhc}
      MARIADB_USER: ${DB_USER:-bhc}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command:
      # utf8mb4 throughout: product names carry accents and the odd symbol, and
      # a latin1 column will silently mangle them on insert.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --innodb-buffer-pool-size=512M
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory-policy allkeys-lru matters: an object cache that refuses writes
    # when full is worse than one that evicts, because WordPress will happily
    # keep asking.
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  wordpress:
    image: wordpress:php8.3-fpm-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-bhc}
      WORDPRESS_DB_USER: ${DB_USER:-bhc}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_REDIS_HOST', 'redis' );
        define( 'WP_REDIS_PORT', 6379 );
        define( 'WP_CACHE_KEY_SALT', '${SITE_HOST:-bonehorncrafts.local}' );
        define( 'WP_ENVIRONMENT_TYPE', '${WP_ENV:-production}' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'DISABLE_WP_CRON', true );
        define( 'WP_MEMORY_LIMIT', '256M' );
    volumes:
      - wp-data:/var/www/html
      # The build itself, mounted live.
      - ../wp-content/themes/bhc-theme:/var/www/html/wp-content/themes/bhc-theme
      - ../wp-content/plugins/bhc-commerce-core:/var/www/html/wp-content/plugins/bhc-commerce-core
      # Repository root, so setup-demo.sh and the CLI helpers are reachable.
      - ..:/opt/bhc:ro

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - wp-data:/var/www/html:ro
      - ../wp-content/themes/bhc-theme:/var/www/html/wp-content/themes/bhc-theme:ro
      - ../wp-content/plugins/bhc-commerce-core:/var/www/html/wp-content/plugins/bhc-commerce-core:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Real cron, because DISABLE_WP_CRON is set above. WordPress's own
  # pseudo-cron fires on page views, which means background work does not run
  # on a quiet store and runs several times at once on a busy one.
  cron:
    image: wordpress:cli-php8.3
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-bhc}
      WORDPRESS_DB_USER: ${DB_USER:-bhc}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - wp-data:/var/www/html
      - ../wp-content/themes/bhc-theme:/var/www/html/wp-content/themes/bhc-theme
      - ../wp-content/plugins/bhc-commerce-core:/var/www/html/wp-content/plugins/bhc-commerce-core
    entrypoint: /bin/sh
    command: -c 'while true; do wp cron event run --due-now --path=/var/www/html || true; sleep 60; done'

volumes:
  db-data:
  wp-data:
