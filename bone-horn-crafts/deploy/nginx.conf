# Bone Horn Crafts — nginx vhost.
#
# Pairs with deploy/docker-compose.yml (upstream "wordpress:9000"), and works
# unchanged on a VPS if you point fastcgi_pass at your local php-fpm socket.
#
# TLS is deliberately absent: on a VPS, certbot writes the listen 443 block and
# the certificate paths for you, and duplicating them here means editing two
# files every renewal. See docs/hosting.md.

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # WooCommerce accepts file uploads on product imports; 64M is enough for a
    # large CSV without inviting someone to post a DVD image.
    client_max_body_size 64M;

    # ------------------------------------------------------------------
    # Security headers the application does not set itself.
    # The application adds X-Content-Type-Options, Referrer-Policy,
    # X-Frame-Options and Permissions-Policy. HSTS belongs here because it is
    # a transport concern and must survive a PHP fatal.
    # Uncomment once TLS is live and you have confirmed every subdomain is on
    # HTTPS — preload is very hard to undo.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ------------------------------------------------------------------
    # Static assets. Long cache, because WordPress fingerprints with ?ver=.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Nothing executable should ever be served out of uploads. A single
    # compromised plugin that lets someone write a .php file there is the
    # difference between a nuisance and a shell.
    location ~* /wp-content/uploads/.*\.(?:php|phtml|php[0-9]|pl|py|cgi|sh)$ {
        deny all;
    }

    # WooCommerce writes its logs under uploads. They are readable text
    # containing order context; they must not be public.
    location ~* /wp-content/uploads/(?:wc-logs|woocommerce_uploads|woocommerce_transient_files)/ {
        deny all;
    }

    # Dotfiles, and the files people forget they left behind.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:wp-config\.php|readme\.html|license\.txt|composer\.(?:json|lock)|package(?:-lock)?\.json|phpcs\.xml\.dist)$ {
        deny all;
    }

    # xmlrpc.php has no legitimate caller on this store and is a standing
    # brute-force and pingback-amplification target. The theme disables it in
    # PHP as well; this stops the request reaching PHP at all.
    location = /xmlrpc.php {
        deny all;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Rate-limit the login form. Defined in http{} scope — see docs/hosting.md
    # for the limit_req_zone line that goes in nginx.conf.
    location = /wp-login.php {
        limit_req zone=bhc_login burst=3 nodelay;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Checkout and the merchandising index can both outlive the default.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
